<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Phoneme Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap');

  :root{
    --bg:#0d0f14; --surface:#161b24; --surface2:#1e2638;
    --accent:#00e5ff; --accent2:#ff4d8b; --warn:#ffb300;
    --text:#e8eaf6; --muted:#6b7a99; --border:#2a3350;
    --sidebar-w:220px;
    --ph-h:44px; --ruler-h:24px; --wave-h:120px; --seg-h:36px;
    --rows:4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ── top bar ── */
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;
         background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  header h1{font-family:'Space Mono',monospace;font-size:15px;letter-spacing:2px;
            color:var(--accent);text-transform:uppercase}
  .btn{background:transparent;border:1px solid var(--border);color:var(--text);
       padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;
       font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.15)}
  .btn.danger{border-color:var(--accent2);color:var(--accent2)}
  .btn.danger:hover{background:var(--accent2);color:#000}
  #statusBar{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;flex:1}

  /* ── body layout ── */
  #body{flex:1;display:flex;overflow:hidden;min-height:0}

  /* ── file sidebar ── */
  #sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);
           display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
  #sidebarHeader{padding:10px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;
                 letter-spacing:1px;border-bottom:1px solid var(--border);flex-shrink:0}
  #fileList{flex:1;overflow-y:auto;padding:6px 0}
  .file-item{padding:8px 12px;cursor:pointer;border-left:3px solid transparent;
             transition:.1s;font-size:12px;display:flex;flex-direction:column;gap:2px}
  .file-item:hover{background:var(--surface2)}
  .file-item.active{border-left-color:var(--accent);background:var(--surface2)}
  .file-item .fname{color:var(--text);font-family:'Space Mono',monospace;
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-item .fmeta{color:var(--muted);font-size:10px}
  .file-item .fstatus{font-size:10px;color:var(--warn)}
  /* progress overlay on sidebar item */
  .file-item.analyzing .fname{color:var(--warn)}
  .file-item.done .fstatus{color:#4caf50}

  /* ── main area ── */
  main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 20px;gap:10px}

  /* ── transport ── */
  #transport{display:flex;align-items:center;gap:12px;flex-shrink:0}
  #playBtn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;
           cursor:pointer;display:flex;align-items:center;justify-content:center;
           color:#000;font-size:16px;flex-shrink:0;transition:.15s}
  #playBtn:hover{filter:brightness(1.2)}
  #timecode{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);
            min-width:90px;text-align:right}
  #volSlider{-webkit-appearance:none;width:80px;height:4px;background:var(--border);
             border-radius:2px;outline:none;cursor:pointer}
  #volSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--accent);cursor:pointer}
  #zoomSlider{-webkit-appearance:none;width:100px;height:4px;background:var(--border);
              border-radius:2px;outline:none;cursor:pointer}
  #zoomSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--warn);cursor:pointer}
  .tlabel{font-size:11px;color:var(--muted)}

  /* ── timeline scroll wrapper ── */
  #timelineOuter{flex:1;overflow-x:auto;overflow-y:hidden;border-radius:10px;
                 border:1px solid var(--border);background:var(--surface);position:relative;
                 min-height:0}
  #timelineInner{position:relative;height:100%}

  /* ── ruler ── */
  #ruler{position:sticky;top:0;height:var(--ruler-h);z-index:10;
         background:var(--surface2);border-bottom:1px solid var(--border)}
  #rulerCanvas{display:block}

  /* ── waveform ── */
  #waveCanvas{display:block;cursor:pointer}

  /* ── segment tracks ── */
  #trackArea{position:relative;height:calc(var(--seg-h) * var(--rows) + 20px)}
  .segment{position:absolute;height:calc(var(--seg-h) - 4px);border-radius:6px;
           display:flex;align-items:center;justify-content:center;font-size:11px;
           font-family:'Space Mono',monospace;cursor:grab;user-select:none;
           border:2px solid transparent;transition:border-color .1s,filter .1s;
           overflow:hidden;white-space:nowrap;padding:0 4px}
  .segment:active{cursor:grabbing}
  .segment.selected{border-color:#fff!important;filter:brightness(1.3)!important}
  .segment.phoneme{background:#1a3a5c;color:var(--accent)}
  .segment.pause{background:#2a1a30;color:var(--accent2)}
  .seg-label{pointer-events:none;text-overflow:ellipsis;overflow:hidden;max-width:90%}
  .seg-conf{position:absolute;bottom:2px;right:4px;font-size:8px;color:rgba(255,255,255,.4)}
  .resize-handle{position:absolute;width:6px;top:0;bottom:0;cursor:ew-resize;z-index:5}
  .resize-handle.left{left:0}
  .resize-handle.right{right:0}

  /* ── playhead ── */
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);
            pointer-events:none;z-index:20;box-shadow:0 0 8px var(--accent)}
  #playhead::before{content:'';position:absolute;top:0;left:-5px;
    border:6px solid transparent;border-top-color:var(--accent);border-bottom:none}

  /* ── info panel ── */
  #infoPanel{background:var(--surface2);border-radius:8px;padding:10px 14px;
             font-size:12px;display:flex;gap:20px;flex-shrink:0;border:1px solid var(--border)}
  .info-item{display:flex;flex-direction:column;gap:2px}
  .info-item .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
  .info-item .v{color:var(--text);font-family:'Space Mono',monospace}

  /* ── toast ── */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
         background:var(--surface2);color:var(--accent);border:1px solid var(--accent);
         padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;
         transition:transform .3s;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* scrollbar */
  #fileList::-webkit-scrollbar{width:4px}
  #fileList::-webkit-scrollbar-track{background:transparent}
  #fileList::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<header>
  <a class="btn" href="/" title="Back to the analysis interface" style="text-decoration:none">‹ Analyses</a>
  <h1>⟨ Phoneme Editor ⟩</h1>
  <span id="statusBar">loading…</span>
  <button class="btn danger" id="delBtn" title="Delete selected (Del)">✕ Delete</button>
  <button class="btn" id="undoBtn">↩ Undo</button>
  <button class="btn primary" id="exportBtn">⬇ Export TSV</button>
  <button class="btn primary" id="exportAllBtn">⬇ Export All</button>
</header>

<div id="body">
  <!-- ── file sidebar ── -->
  <div id="sidebar">
    <div id="sidebarHeader">Files (<span id="fileCount">0</span>)</div>
    <div id="fileList"></div>
  </div>

  <!-- ── editor ── -->
  <main>
    <div id="transport">
      <button id="playBtn">▶</button>
      <span class="tlabel">Vol</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
      <span class="tlabel">Zoom</span>
      <input type="range" id="zoomSlider" min="1" max="20" step="0.5" value="4">
      <span id="timecode">0.000 s</span>
      <span style="flex:1"></span>
      <span id="segCount" style="font-size:12px;color:var(--muted)"></span>
    </div>

    <div id="timelineOuter">
      <div id="timelineInner">
        <canvas id="ruler"></canvas>
        <canvas id="waveCanvas"></canvas>
        <div id="trackArea"><div id="playhead"></div></div>
      </div>
    </div>

    <div id="infoPanel">
      <div class="info-item"><span class="k">File</span><span class="v" id="iFile">—</span></div>
      <div class="info-item"><span class="k">Selected</span><span class="v" id="iLabel">—</span></div>
      <div class="info-item"><span class="k">Kind</span><span class="v" id="iKind">—</span></div>
      <div class="info-item"><span class="k">Start</span><span class="v" id="iStart">—</span></div>
      <div class="info-item"><span class="k">End</span><span class="v" id="iEnd">—</span></div>
      <div class="info-item"><span class="k">Duration</span><span class="v" id="iDur">—</span></div>
      <div class="info-item"><span class="k">Confidence</span><span class="v" id="iConf">—</span></div>
      <div class="info-item"><span class="k">Total segments</span><span class="v" id="iTotal">—</span></div>
    </div>
  </main>
</div>

<div id="toast"></div>
<audio id="audioEl" style="display:none"></audio>

<script>
// ═══════════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════════
let fileList = [];          // from /api/filelist
let currentFileIndex = 0;
let segments=[], rmsData=[], duration=0, pxPerSec=200, selected=null;
let history=[], maxHistory=50;

// ── FIX 2: client-side segment cache keyed by file index ──────────
const segmentCache = {};   // { [fileIndex]: segments[] }

const audioEl  = document.getElementById('audioEl');
const waveCV   = document.getElementById('waveCanvas');
const rulerCV  = document.getElementById('ruler');
const trackArea= document.getElementById('trackArea');
const playhead = document.getElementById('playhead');
const inner    = document.getElementById('timelineInner');
const outer    = document.getElementById('timelineOuter');
const timecode = document.getElementById('timecode');

// ═══════════════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════════════
async function init(){
  setStatus('Fetching file list…');
  const res = await fetch('/api/filelist');
  fileList  = await res.json();
  document.getElementById('fileCount').textContent = fileList.length;
  renderSidebar();
  if(fileList.length > 0) await loadFile(0);
}

function setStatus(t){ document.getElementById('statusBar').textContent = t; }

// ═══════════════════════════════════════════════════════════════════
//  Sidebar
// ═══════════════════════════════════════════════════════════════════
function renderSidebar(){
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  fileList.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'file-item' + (i === currentFileIndex ? ' active' : '');
    item.dataset.index = i;
    item.innerHTML = `
      <span class="fname" title="${f.name}">${f.name}</span>
      <span class="fmeta">${f.duration.toFixed(2)}s · ${f.n_segments} segs</span>
    `;
    item.addEventListener('click', () => loadFile(i));
    list.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════════════════
//  Load a file by index
//  FIX 2: save current edits to cache before switching; restore on return
// ═══════════════════════════════════════════════════════════════════
async function loadFile(idx){
  // ── save current edits into cache before leaving ──
  if(segments.length > 0){
    segmentCache[currentFileIndex] = JSON.parse(JSON.stringify(segments));
    // also persist to server so Export All sees latest edits
    await fetch('/api/save_segments', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({file_index: currentFileIndex, segments: segments})
    });
  }

  // pause playback
  audioEl.pause(); document.getElementById('playBtn').textContent='▶';

  currentFileIndex = idx;
  selected = null;
  history  = [];

  setStatus(`Loading file ${idx+1}/${fileList.length}…`);
  renderSidebar();

  const res  = await fetch(`/api/data?file=${idx}`);
  const data = await res.json();

  // ── restore from cache if we've visited this file before ──
  if(segmentCache[idx]){
    segments = JSON.parse(JSON.stringify(segmentCache[idx]));
  } else {
    segments = data.segments;
    segmentCache[idx] = JSON.parse(JSON.stringify(segments));
  }

  rmsData    = data.rms;
  duration   = data.duration;
  audioEl.src= data.audio_b64;

  document.getElementById('iFile').textContent = fileList[idx]?.name || '—';
  document.getElementById('iTotal').textContent = segments.length;
  setStatus(`${fileList[idx].name} · ${segments.length} segments · ${duration.toFixed(2)}s`);
  saveHistory();
  applyZoom();
  renderAll();
}

// ═══════════════════════════════════════════════════════════════════
//  Layout helpers
// ═══════════════════════════════════════════════════════════════════
function totalW(){ return Math.max(outer.clientWidth, duration * pxPerSec + 40); }

function applyZoom(){
  pxPerSec = parseFloat(document.getElementById('zoomSlider').value) * 50;
  const w   = totalW();
  inner.style.width   = w + 'px';
  inner.style.minWidth= w + 'px';
}

document.getElementById('zoomSlider').addEventListener('input', ()=>{ applyZoom(); renderAll(); });
document.getElementById('volSlider').addEventListener('input', e=>{ audioEl.volume=e.target.value; });

// ═══════════════════════════════════════════════════════════════════
//  Draw ruler
// ═══════════════════════════════════════════════════════════════════
function drawRuler(){
  const w = totalW(), ctx = rulerCV.getContext('2d');
  rulerCV.width=w; rulerCV.height=24;
  ctx.fillStyle='#1e2638'; ctx.fillRect(0,0,w,24);
  ctx.font='10px Space Mono,monospace';
  const step = pxPerSec >= 200 ? 0.1 : pxPerSec >= 80 ? 0.5 : 1;
  for(let t=0; t<=duration+step; t+=step){
    const x = t*pxPerSec; if(x>w) break;
    const major = Math.abs(t % 1) < 1e-6;
    ctx.strokeStyle = major ? '#3a4a6a' : '#2a3350';
    ctx.beginPath(); ctx.moveTo(x, major?0:16); ctx.lineTo(x,24); ctx.stroke();
    if(major){ ctx.fillStyle='#6b7a99'; ctx.fillText(t.toFixed(0)+'s', x+3, 14); }
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Draw waveform
// ═══════════════════════════════════════════════════════════════════
function drawWave(){
  const WAVE_H=120, w=totalW(), ctx=waveCV.getContext('2d');
  waveCV.width=w; waveCV.height=WAVE_H;
  ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,w,WAVE_H);
  if(!rmsData.length) return;
  const barW = w / rmsData.length;
  const maxRms = Math.max(...rmsData) || 1;
  ctx.fillStyle='rgba(0,229,255,0.15)';
  for(let i=0;i<rmsData.length;i++){
    const h=(rmsData[i]/maxRms)*(WAVE_H-4);
    ctx.fillRect(i*barW, WAVE_H/2-h/2, Math.max(barW-0.5,0.5), h);
  }
  ctx.strokeStyle='rgba(0,229,255,0.5)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  for(let i=0;i<rmsData.length;i++){
    const h=(rmsData[i]/maxRms)*(WAVE_H-4);
    const x=i*barW+barW/2, y=WAVE_H/2-h/2;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.beginPath();
  for(let i=rmsData.length-1;i>=0;i--){
    const h=(rmsData[i]/maxRms)*(WAVE_H-4);
    const x=i*barW+barW/2, y=WAVE_H/2+h/2;
    i===rmsData.length-1?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,WAVE_H/2); ctx.lineTo(w,WAVE_H/2); ctx.stroke();
  segments.forEach(s=>{
    const x=s.start*pxPerSec, sw=(s.end-s.start)*pxPerSec;
    ctx.fillStyle=s.kind==='phoneme'?'rgba(0,229,255,0.07)':'rgba(255,77,139,0.07)';
    ctx.fillRect(x,0,sw,WAVE_H);
  });
}

// ═══════════════════════════════════════════════════════════════════
//  Segment DOM elements
// ═══════════════════════════════════════════════════════════════════
const TRACK_H=40;
const LANE_COLORS_PH=['#0d2b4a','#0d3a5c','#0a2740','#123352'];
const LANE_COLORS_PA=['#2a0f25','#3a1535','#200b1e','#301228'];

function assignLanes(segs){
  const laneEnds=[];
  segs.forEach(s=>{
    let lane=0;
    while(laneEnds[lane]!==undefined && laneEnds[lane]>s.start+0.005) lane++;
    s._lane=lane; laneEnds[lane]=s.end;
  });
}

function renderSegments(){
  trackArea.querySelectorAll('.segment').forEach(el=>el.remove());
  assignLanes(segments);
  const maxLane = segments.reduce((m,s)=>Math.max(m,s._lane),0);
  trackArea.style.height = (TRACK_H*(maxLane+1)+20)+'px';
  segments.forEach((seg,idx)=>{
    const el=document.createElement('div');
    el.className=`segment ${seg.kind}${seg===selected?' selected':''}`;
    const x=seg.start*pxPerSec, w=Math.max((seg.end-seg.start)*pxPerSec,12);
    const y=seg._lane*TRACK_H+4;
    el.style.left=x+'px'; el.style.width=w+'px'; el.style.top=y+'px';
    const col=seg.kind==='phoneme'?LANE_COLORS_PH:LANE_COLORS_PA;
    el.style.background=col[seg._lane%col.length];
    const lbl=document.createElement('span');
    lbl.className='seg-label'; lbl.textContent=seg.label; el.appendChild(lbl);
    if(seg.kind==='phoneme'){
      const cf=document.createElement('span');
      cf.className='seg-conf'; cf.textContent=(seg.conf*100).toFixed(0)+'%'; el.appendChild(cf);
    }
    ['left','right'].forEach(side=>{
      const h=document.createElement('div');
      h.className=`resize-handle ${side}`;
      h.addEventListener('mousedown', e=>startResize(e,idx,side));
      el.appendChild(h);
    });
    el.addEventListener('mousedown', e=>{ if(e.target.classList.contains('resize-handle')) return; startDrag(e,idx); });
    el.addEventListener('dblclick', ()=>renameSegment(idx));
    el.addEventListener('click', e=>{ e.stopPropagation(); selectSeg(idx); });
    trackArea.appendChild(el);
  });
  document.getElementById('segCount').textContent=
    `${segments.filter(s=>s.kind==='phoneme').length} phonemes · ${segments.filter(s=>s.kind==='pause').length} pauses`;
  document.getElementById('iTotal').textContent=segments.length;
}

function renderAll(){ drawRuler(); drawWave(); renderSegments(); updatePlayhead(); }

// ═══════════════════════════════════════════════════════════════════
//  Selection & info panel
// ═══════════════════════════════════════════════════════════════════
function selectSeg(idx){
  selected = idx===null ? null : segments[idx];
  renderSegments();
  if(selected){
    document.getElementById('iLabel').textContent=selected.label;
    document.getElementById('iKind').textContent=selected.kind;
    document.getElementById('iStart').textContent=selected.start.toFixed(4)+'s';
    document.getElementById('iEnd').textContent=selected.end.toFixed(4)+'s';
    document.getElementById('iDur').textContent=((selected.end-selected.start)*1000).toFixed(1)+'ms';
    document.getElementById('iConf').textContent=selected.kind==='phoneme'?(selected.conf*100).toFixed(1)+'%':'—';
  } else {
    ['iLabel','iKind','iStart','iEnd','iDur','iConf'].forEach(id=>document.getElementById(id).textContent='—');
  }
}
trackArea.addEventListener('click', ()=>selectSeg(null));

// ═══════════════════════════════════════════════════════════════════
//  Drag / Resize / Rename / Delete
// ═══════════════════════════════════════════════════════════════════
function startDrag(e, idx){
  e.preventDefault(); e.stopPropagation(); selectSeg(idx);
  const seg=segments[idx], startX=e.clientX, origStart=seg.start, dur=seg.end-seg.start;
  function onMove(ev){ const dx=(ev.clientX-startX)/pxPerSec; seg.start=Math.max(0,origStart+dx); seg.end=seg.start+dur; renderSegments(); drawWave(); }
  function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); saveHistory(); }
  document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
}

function startResize(e, idx, side){
  e.preventDefault(); e.stopPropagation(); selectSeg(idx);
  const seg=segments[idx], startX=e.clientX, origStart=seg.start, origEnd=seg.end;
  function onMove(ev){ const dx=(ev.clientX-startX)/pxPerSec; if(side==='left'){seg.start=Math.max(0,Math.min(origStart+dx,seg.end-0.01));}else{seg.end=Math.max(seg.start+0.01,origEnd+dx);} renderSegments(); drawWave(); selectSeg(segments.indexOf(seg)); }
  function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); saveHistory(); }
  document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
}

function renameSegment(idx){ const seg=segments[idx]; const val=prompt('Rename segment:',seg.label); if(val!==null&&val.trim()){seg.label=val.trim();saveHistory();renderAll();} }

function deleteSelected(){ if(!selected)return; saveHistory(); segments=segments.filter(s=>s!==selected); selected=null; renderAll(); toast('Segment deleted'); }
document.getElementById('delBtn').addEventListener('click', deleteSelected);
document.addEventListener('keydown', e=>{ if((e.key==='Delete'||e.key==='Backspace')&&selected) deleteSelected(); });

// ═══════════════════════════════════════════════════════════════════
//  History
// ═══════════════════════════════════════════════════════════════════
function saveHistory(){ history.push(JSON.parse(JSON.stringify(segments))); if(history.length>50)history.shift(); }
function undo(){ if(history.length<2)return; history.pop(); segments=JSON.parse(JSON.stringify(history[history.length-1])); selected=null; renderAll(); toast('Undo'); }
document.getElementById('undoBtn').addEventListener('click', undo);
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();} });

// ═══════════════════════════════════════════════════════════════════
//  Playback
// ═══════════════════════════════════════════════════════════════════
const playBtn=document.getElementById('playBtn');
playBtn.addEventListener('click', ()=>{ if(audioEl.paused){audioEl.play();playBtn.textContent='⏸';}else{audioEl.pause();playBtn.textContent='▶';} });
audioEl.addEventListener('ended', ()=>{ playBtn.textContent='▶'; });
audioEl.addEventListener('timeupdate', ()=>{
  const t=audioEl.currentTime; timecode.textContent=t.toFixed(3)+' s'; updatePlayhead(t);
  const px=t*pxPerSec, scrollLeft=outer.scrollLeft, vw=outer.clientWidth;
  if(px>scrollLeft+vw-80||px<scrollLeft) outer.scrollLeft=Math.max(0,px-vw/3);
});
function updatePlayhead(t){ if(t===undefined)t=audioEl.currentTime; playhead.style.left=(t*pxPerSec)+'px'; }

// ── FIX 1: seek on waveform click — correct scroll-adjusted x position ──
waveCV.addEventListener('click', e=>{
  // getBoundingClientRect gives position relative to viewport.
  // The canvas is inside a scrollable container, so we must add scrollLeft
  // to get the true canvas-local x coordinate.
  const rect = waveCV.getBoundingClientRect();
  const x = e.clientX - rect.left + outer.scrollLeft;
  const t = Math.max(0, Math.min(x / pxPerSec, duration));
  audioEl.currentTime = t;
  // Immediately update playhead and timecode without waiting for timeupdate
  timecode.textContent = t.toFixed(3) + ' s';
  updatePlayhead(t);
});

// keyboard navigation between files
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'&&e.altKey){ e.preventDefault(); if(currentFileIndex<fileList.length-1) loadFile(currentFileIndex+1); }
  if(e.key==='ArrowLeft'&&e.altKey){  e.preventDefault(); if(currentFileIndex>0) loadFile(currentFileIndex-1); }
});

// ═══════════════════════════════════════════════════════════════════
//  Export
// ═══════════════════════════════════════════════════════════════════
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const res=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({segments, file_index: currentFileIndex})});
  const data=await res.json();
  if(data.status==='ok') toast('Saved → '+data.path);
});

document.getElementById('exportAllBtn').addEventListener('click', async ()=>{
  // Save current file's edits first
  segmentCache[currentFileIndex] = JSON.parse(JSON.stringify(segments));
  await fetch('/api/save_segments', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({file_index: currentFileIndex, segments: segments})
  });

  toast('Exporting all files…');
  let count=0;
  for(let i=0;i<fileList.length;i++){
    const res=await fetch(`/api/data?file=${i}`);
    const data=await res.json();
    await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({segments:data.segments, file_index:i})});
    count++;
  }
  toast(`Exported ${count} files`);
});

// ═══════════════════════════════════════════════════════════════════
//  Toast & resize
// ═══════════════════════════════════════════════════════════════════
let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2500); }
window.addEventListener('resize', ()=>{ applyZoom(); renderAll(); });

init();
</script>
</body>
</html>
